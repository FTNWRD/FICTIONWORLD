<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fiction World</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: Arial, sans-serif;
      color: white;
      background-image: url('https://i.ibb.co/syWcTYm/skull-bg.jpg'); /* Ganti jika ada bg sendiri */
      background-size: cover;
      background-position: center;
    }
    .container {
      text-align: center;
      padding: 50px 20px;
      background-color: rgba(0, 0, 0, 0.85);
    }
    .logo {
      font-size: 40px;
      color: #ff0000;
      font-family: Impact, fantasy;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .genre {
      margin-bottom: 30px;
      color: #aaa;
    }
    .btn {
      display: block;
      margin: 10px auto;
      padding: 12px 20px;
      background-color: transparent;
      color: white;
      border: 2px solid red;
      border-radius: 5px;
      width: 250px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .btn:hover {
      background-color: red;
      color: black;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">FICTION WORLD</div>
    <h2>HELLO WORLD</h2>
    <div class="tagline">Brutal streetwear brand born from noise, distortion, and rebellion.</div>
    <div class="genre">Hardcore • Metal • Grunge</div>

    <a href="https://www.redbubble.com/people/fictionworld/shop" class="btn">SHOP ON REDBUBBLE</a>
    <a href="https://www.teepublic.com/user/fictionworld" class="btn">SHOP ON TEEPUBLIC</a>
    <a href="https://instagram.com/fiction_std" class="btn">INSTAGRAM</a>
    <a href="https://tiktok.com/@ftnwrd.co" class="btn">TIKTOK</a>
    <a href="https://facebook.com/deri.syautra.3990" class="btn">FACEBOOK</a>
    <a href="https://youtube.com/@fictionterraces" class="btn">YOUTUBE</a>
  </div>
</body>
</html>

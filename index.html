<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiction World</title>

  <style>
    /* Load custom font */
    @font-face {
      font-family: 'FictionWorld';
      src: url('fictionworld.ttf') format('truetype');
    }

    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: 'FictionWorld', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 60px;
      color: red;
      letter-spacing: 3px;
    }

    p {
      font-size: 20px;
      color: white;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div>
    <h1>FICTION WORLD</h1>
    <p>Clothing | Metal | Underground</p>
  </div>
</body>
</html>
